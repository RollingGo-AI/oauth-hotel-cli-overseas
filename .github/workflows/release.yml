name: Build and Release Executables

on:
  push:
    tags:
      - 'v*' # Trigger build and release on tags starting with v
  workflow_dispatch: # Allow manual trigger on GitHub UI

permissions:
  contents: write # Allow Action to create Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Compile Executables
        run: |
          # Use Bun to compile Node.js ESM to multi-platform single-file executables
          bun build ./dist/index.js --compile --target bun-windows-x64 --outfile rgg-windows.exe
          bun build ./dist/index.js --compile --target bun-darwin-x64 --outfile rgg-macos
          bun build ./dist/index.js --compile --target bun-darwin-arm64 --outfile rgg-macos-arm64
          bun build ./dist/index.js --compile --target bun-linux-x64 --outfile rgg-linux

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') # Only create release when a tag is pushed
        with:
          files: |
            rgg-windows.exe
            rgg-macos
            rgg-macos-arm64
            rgg-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
